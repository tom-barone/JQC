[tools]
opentofu = "1.11.5"
just = "1.46.0"
node = "24.14.0"
sops = "3.12.1"
ruby = "3.3.10"
age = "1.3.1"
tflint = "0.63.1"
hadolint = "2.14.0"
yamllint = "1.38.0"
actionlint = "1.7.11"
uv = "0.10.8"

# Faster than compiling from source
[settings.ruby]
compile = false

[settings]
# We seem to keep timing out at mise installs during github actions. Have seen failures at:
#  1. the default (20s)
#  2. 120s
# so now try increasing to 240s to see if that helps.
fetch_remote_versions_timeout = "240s"
